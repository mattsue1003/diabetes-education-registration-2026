<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#13213a;--blue:#3958f5;--coral:#ff7058;--cream:#fff8ec;--yellow:#ffd84c;--muted:#596174;--line:#d8dbe4}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:'Noto Sans TC',sans-serif}
    .top{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,7vw,104px);font-size:11px;font-weight:900;letter-spacing:.13em;border-bottom:1px solid #e8e7e2}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;background:var(--coral);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:500}.top>span:last-child{color:var(--blue)}
    .hero{background:linear-gradient(90deg,rgba(57,88,245,1) 0%,rgba(57,88,245,.96) 37%,rgba(57,88,245,.7) 69%,rgba(19,33,58,.55) 100%);color:#fff;padding:clamp(45px,7vw,88px) clamp(22px,10vw,150px) clamp(52px,8vw,100px);position:relative;overflow:hidden;isolation:isolate}
    .hero-photo{position:absolute;z-index:-1;right:0;top:0;width:65%;height:100%;object-fit:cover;object-position:center 48%;opacity:.9;mask-image:linear-gradient(90deg,transparent 0%,#000 43%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 43%)}
    .hero:before{content:'';position:absolute;z-index:-1;width:290px;height:290px;border:42px solid var(--yellow);border-radius:50%;right:8%;top:-105px;opacity:.96}
    .hero:after{content:'✳';position:absolute;right:17%;bottom:-55px;color:var(--coral);font-size:170px;line-height:1;transform:rotate(-12deg)}
    .eyebrow{display:inline-block;background:var(--yellow);color:var(--navy);font-size:11px;letter-spacing:.15em;font-weight:900;padding:8px 12px;transform:rotate(-2deg)}
    .hero h1{font-size:clamp(38px,7vw,78px);line-height:1.12;letter-spacing:-.045em;margin:23px 0 18px;max-width:800px;font-weight:900;text-shadow:3px 3px 0 rgba(19,33,58,.18)}.hero p{color:#edf0ff;margin:0;font-size:15px;font-weight:500}
    main{max-width:1120px;margin:0 auto;padding:clamp(38px,6vw,74px) 24px 82px;display:grid;grid-template-columns:.78fr 1.22fr;gap:64px;align-items:start}
    .intro{padding-top:8px}.intro h2{font-size:clamp(23px,3vw,32px);line-height:1.45;margin:0 0 17px;font-weight:900}.intro p{color:var(--muted);font-size:14px;line-height:2;margin:0}.note{margin-top:28px;background:var(--yellow);padding:15px 17px;color:var(--navy);font-size:12px;line-height:1.8;font-weight:700;box-shadow:5px 5px 0 var(--navy)}
    form{background:#fff;border:2px solid var(--navy);padding:clamp(23px,4vw,42px);box-shadow:10px 10px 0 var(--coral)}.form-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:17px;margin-bottom:25px}.form-head strong{font-size:19px;font-weight:900}.required{font-size:11px;color:var(--muted)}
    .field{margin:0 0 22px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:9px}.star{color:#e4513d;margin-left:4px}.field input[type=text],.field input[type=tel]{width:100%;height:50px;border:1.5px solid #b9bfcc;background:#fff;padding:0 14px;font:inherit;font-size:14px;border-radius:5px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:3px 3px 0 var(--yellow)}
    .upload{display:block;border:2px dashed #aeb6c7;background:#f8f9fd;padding:19px;border-radius:7px;cursor:pointer;transition:.2s}.upload:hover{border-color:var(--blue);background:#f0f2ff}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload-inner{display:flex;align-items:center;gap:14px}.upload-icon{width:44px;height:44px;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:21px;border-radius:50%}.upload b{font-size:13px}.upload small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.filename{font-size:12px;color:#444;margin-top:12px;word-break:break-all}
    .hp-wrap{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}.response-frame{display:none}
    .consent{display:flex;align-items:flex-start;gap:10px;margin:24px 0 19px;font-size:12px;line-height:1.8;color:#414b60}.consent input{accent-color:var(--blue);margin-top:4px;width:16px;height:16px;flex:none}.privacy{padding:14px;background:#f3f4f9;font-size:11px;line-height:1.8;color:#596174;margin:0 0 22px;border-left:4px solid var(--blue)}
    button{width:100%;height:56px;background:var(--coral);color:#fff;border:2px solid var(--navy);border-radius:5px;font:inherit;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:4px 4px 0 var(--navy);transition:.18s}button:hover{background:#f15f48;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}button:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:4px 4px 0 var(--navy)}.status{min-height:24px;margin-top:14px;text-align:center;font-size:13px;font-weight:700}.status.error{color:#b3422a}.status.success{color:#2a6c43}
    footer{background:var(--navy);color:#fff;padding:22px clamp(20px,7vw,104px);font-size:11px;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.06em}
    @media(max-width:760px){.hero-photo{width:100%;opacity:.32;mask-image:linear-gradient(90deg,rgba(0,0,0,.2),#000);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.2),#000)}.hero:before{right:-95px;top:-130px;width:240px;height:240px}.hero:after{right:4%;font-size:120px;bottom:-40px;opacity:.85}main{grid-template-columns:1fr;gap:31px;padding-top:36px}.intro h2{font-size:23px}.top{height:62px}.top>span:last-child{display:none}footer{gap:12px;flex-direction:column}}
  </style>
</head>

  <main>
    <section class="intro"><h2>歡迎報名<br>一起學習糖尿病照護</h2><p>請填寫基本資料，並上傳檢驗報告或轉介單，方便課程團隊進行報名資料確認。</p><div class="note">送出前請確認電話號碼正確，並確認上傳檔案內容清晰可辨。</div></section>
    <form id="registrationForm">
      <div class="form-head"><strong>報名資料</strong><span class="required">＊為必填欄位</span></div>
      <div class="field"><label for="name">姓名<span class="star">＊</span></label><input id="name" name="name" type="text" autocomplete="name" maxlength="50" required placeholder="請輸入姓名"></div>
      <div class="field"><label for="phone">聯絡電話<span class="star">＊</span></label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" pattern="09[0-9]{8}" required placeholder="例：0912345678"></div>
      <div class="field"><label>檢驗報告或轉介單<span class="star">＊</span></label><label class="upload" for="file"><input id="file" name="file" type="file" accept="image/*,application/pdf" required><span class="upload-inner"><span class="upload-icon">↑</span><span><b>選擇照片或 PDF</b><small>限上傳一個檔案，格式為照片或 PDF，最大 10 MB</small></span></span><span class="filename" id="filename">尚未選擇檔案</span></label></div>
      <div class="privacy">個人資料告知：所蒐集的姓名、聯絡電話及上傳文件，僅供本課程報名聯繫與資格確認使用，並由課程承辦單位妥善保管。</div>
      <label class="consent"><input type="checkbox" id="consent" required><span>我已閱讀並同意個人資料蒐集告知<span class="star">＊</span></span></label>
      <div class="hp-wrap" aria-hidden="true"><label>網站<input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
      <button id="submitBtn" type="submit">送出報名資料　↗</button><div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <iframe id="gasResponseFrame" name="gasResponseFrame" class="response-frame" title="表單送出狀態" aria-hidden="true"></iframe>
  </main>
  <footer><span>糖尿病衛教課程報名</span><span>CARE · KNOWLEDGE · WELLNESS</span></footer>
  <script>
    const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbyUcum5tlXm118EPL1NiOIKoh6WeEhr6WlR_kTF_uS6nAdHmfK81szQA1Nbh5P8nemN/exec';
    const form=document.getElementById('registrationForm'), fileInput=document.getElementById('file'), statusBox=document.getElementById('status'), submitBtn=document.getElementById('submitBtn'), responseFrame=document.getElementById('gasResponseFrame');
    let pendingTransport=null, responseTimer=null;
    fileInput.addEventListener('change',()=>{document.getElementById('filename').textContent=fileInput.files[0]?fileInput.files[0].name:'尚未選擇檔案';});
    window.addEventListener('message',(event)=>{
      if(event.source!==responseFrame.contentWindow||!event.data||event.data.channel!=='diabetes-registration-response')return;
      clearTimeout(responseTimer);if(pendingTransport){pendingTransport.remove();pendingTransport=null;}
      if(event.data.ok){form.reset();document.getElementById('filename').textContent='尚未選擇檔案';statusBox.textContent=event.data.message;statusBox.className='status success';}
      else showError(event.data.message||'資料送出失敗，請稍後再試。');
      submitBtn.disabled=false;submitBtn.textContent='送出報名資料　↗';
    });
    form.addEventListener('submit', async (event)=>{
      event.preventDefault();statusBox.textContent='';statusBox.className='status';
      if(!(GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')&&GAS_WEB_APP_URL.endsWith('/exec'))){showError('請先在網頁程式中填入 Apps Script 部署網址。');return;}
      const phone=document.getElementById('phone').value.trim(),file=fileInput.files[0];
      if(!/^09\d{8}$/.test(phone)){showError('請輸入 09 開頭的 10 碼手機號碼。');return;}
      if(!file){showError('請選擇要上傳的檔案。');return;}
      if(file.size>10*1024*1024){showError('檔案大小不可超過 10 MB。');return;}
      if(!(file.type==='application/pdf'||(file.type.startsWith('image/')&&file.type!=='image/svg+xml'))){showError('檔案格式限照片或 PDF。');return;}
      submitBtn.disabled=true;submitBtn.textContent='資料送出中…';
      try{
        const base64=await readFileAsBase64(file);
        const payload={name:document.getElementById('name').value.trim(),phone,consent:document.getElementById('consent').checked,website:document.getElementById('website').value,file:{name:file.name,mimeType:file.type||'application/octet-stream',data:base64}};
        pendingTransport=document.createElement('form');pendingTransport.method='POST';pendingTransport.action=GAS_WEB_APP_URL;pendingTransport.target='gasResponseFrame';pendingTransport.enctype='application/x-www-form-urlencoded';
        const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);pendingTransport.appendChild(input);document.body.appendChild(pendingTransport);
        HTMLFormElement.prototype.submit.call(pendingTransport);
        responseTimer=setTimeout(()=>{if(pendingTransport){pendingTransport.remove();pendingTransport=null;}showError('尚未收到回覆。請稍後確認是否已送出，避免重複提交。');submitBtn.disabled=false;submitBtn.textContent='送出報名資料　↗';},90000);
      }catch(error){if(pendingTransport){pendingTransport.remove();pendingTransport=null;}showError(error.message||'無法讀取檔案，請重新選擇。');submitBtn.disabled=false;submitBtn.textContent='送出報名資料　↗';}
    });
    function readFileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('檔案讀取失敗。'));reader.readAsDataURL(file);});}
    function showError(message){statusBox.textContent=message;statusBox.className='status error';}
  </script>
</body>
</html>
